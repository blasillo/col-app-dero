version: "3.9"

services:
  colapp:
    image: blasillo/colapp-image:latest
    container_name: colapp
    ports:
      - "8080" # opcional, solo para acceso directo al contenedor
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    depends_on:
      - colapp
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped