version: '3.8'
services:
  oracle-db:
    ports:
      - '1521:1521'
    container_name: oracle
    image: gvenzl/oracle-free
    environment:
      ORACLE_PASSWORD: Sup3rS3cr3t0
    networks:
      - app-network
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colapp
    image: blasillo/colapp:version1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521:FREE
    networks:
      - app-network
    depends_on:
      - oracle-db
    restart: always

networks:
  app-network:
    driver: bridge
