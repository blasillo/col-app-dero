services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: colappdb
      MYSQL_USER: colapp                    # ← CAMBIADO
      MYSQL_PASSWORD: c0lapp!p4$$wd         # ← CAMBIADO
    command: --lower_case_table_names=1
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colapp
    image: blasillo/colapp-mysql:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/colappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: colapp
      SPRING_DATASOURCE_PASSWORD: c0lapp!p4$$wd
    networks:
      - app-network
    depends_on:
      - mysql-db
    restart: always
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app
    restart: always

networks:
  app-network:
    driver: bridge
